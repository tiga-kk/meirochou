<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ComiPath Catalog Sender 設定</title>
  </head>
  <body>
    <main>
      <h1>カタログ送信設定</h1>
      <form id="settings-form">
        <p><label>GAS Web App URL <input id="gas-url" type="url" required /></label></p>
        <p><label>シート名 <input id="sheet-name" type="text" required /></label></p>
        <button type="submit">保存</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
